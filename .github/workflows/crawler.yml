name: Bharat Sahayaka Crawler

on:
  workflow_dispatch:
    inputs:
      seed_url:
        description: "Website URL to crawl"
        required: true
        type: string

      max_pages:
        description: "Maximum pages"
        required: false
        default: "10"
        type: string

      max_depth:
        description: "Maximum crawl depth"
        required: false
        default: "1"
        type: string

jobs:
  crawl:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run crawler
        env:
          MAX_PAGES: ${{ inputs.max_pages }}
          MAX_DEPTH: ${{ inputs.max_depth }}
          CRAWL_DELAY: "1"
          MAX_RETRIES: "3"
          REQUEST_TIMEOUT: "10"
          RESPECT_ROBOTS: "true"
        run: |
          python crawler.py "${{ inputs.seed_url }}"
